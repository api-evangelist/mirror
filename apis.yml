image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/mirror.png
name: Mirror
description: >-
  Mirror Protocol is a decentralized finance (DeFi) synthetic-assets protocol
  built on the Terra blockchain (with an Ethereum bridge) that mints mirrored
  assets (mAssets) tracking the prices of real-world equities, commodities, and
  other assets. Its public developer surface is the Mirror API — a read-only
  GraphQL data service exposing protocol state (assets, prices, positions,
  staking) — together with the mirror.js JavaScript/TypeScript SDK and the
  mirrorcli command-line interface for querying and executing against the
  on-chain CosmWasm contracts. The protocol is governed by the MIR token. It is
  now in a legacy/dormant state following the May 2022 Terra/LUNA collapse,
  though its documentation, GitHub org, SDKs, and GraphQL endpoint remain
  reachable.
